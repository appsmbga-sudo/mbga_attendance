<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - Attendance Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #b0d4de;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: #f7f9fa;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .title-large {
            font-size: 32px;
            font-weight: 800;
            color: #0b2545;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .title-medium {
            font-size: 24px;
            font-weight: 700;
            color: #134074;
            margin-bottom: 6px;
        }

        .title-small {
            font-size: 16px;
            font-weight: 500;
            color: #1d4e89;
            margin-bottom: 25px;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
        }

        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 800;
            color: #05162e;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid #ccd7e0;
            border-radius: 12px;
            background-color: #fcfdfe;
            color: #333;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #134074;
            box-shadow: 0 0 0 3px rgba(19, 64, 116, 0.15);
        }

        .form-input::placeholder {
            color: #8c9ba5;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background-color: #0b2545;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .btn-submit:hover {
            background-color: #134074;
        }

        .footer-text {
            font-size: 12px;
            color: #667085;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="title-large">FACULTY LOGIN</h1>
        <h2 class="title-medium">Attendance Portal</h2>
        <h3 class="title-small">Academic Year 2026</h3>

        <div class="logo-container">
            <img src="logo.png" alt="Academy Logo">
        </div>

        <form id="loginForm">
            
            <div class="form-group">
                <label class="form-label" for="username">USERNAME</label>
                <input class="form-input" type="text" id="username" placeholder="Enter your username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="verification-code">VERIFICATION CODE</label>
                <input class="form-input" type="password" id="verification-code" placeholder="Enter access code" required>
            </div>

            <button type="submit" class="btn-submit">SIGN IN</button>
            
        </form>

        <div class="footer-text">
            &copy; 2026 MBGA. All Rights Reserved.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const code = document.getElementById('verification-code').value;

            window.location.href = "https://forms.cloud.microsoft/r/ULvNLjCRE4";
        });
    </script>

</body>
</html>
