<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Attendance Portal - Mohammed Bin Ghanim Academy</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            background-image: linear-gradient(135deg, #e0e6ed 0%, #f0f2f5 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border-top: 5px solid #1a478a; /* Royal Blue top border */
            border-bottom: 5px solid #bfa15c; /* Gold bottom border */
        }
        .academy-logo {
            width: 160px;
            height: auto;
            margin-bottom: 1.5rem;
        }
        h2 { 
            color: #1a478a; 
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .input-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #1a478a;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #bfa15c;
            outline: none;
            box-shadow: 0 0 5px rgba(191, 161, 92, 0.3);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #1a478a; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s; 
            margin-top: 10px;
        }
        button:hover { 
            background-color: #143566; 
        }
        #error-msg { 
            color: #d9534f; 
            margin-top: 15px; 
            display: none; 
            font-size: 0.85rem;
            font-weight: bold;
        }
        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="login-card">
    <img src="logo.png" alt="MBGMA Academy Logo" class="academy-logo">
    
    <h2>Attendance Portal</h2>
    <p class="subtitle">Academic Year 2026 - Faculty Login</p>
    
    <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username">
    </div>
    
    <div class="input-group">
        <label for="password">Verification Code</label>
        <input type="password" id="password" placeholder="Enter access code">
    </div>
    
    <button onclick="checkLogin()">Sign In</button>
    <p id="error-msg">Invalid credentials. Please try again.</p>
    
    <p class="footer-text">© 2026 MBGA. All Rights Reserved.</p>
</div>

<script>
    function checkLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');
        
        // Credentials check
        if (user === "MBGASTAFF" && pass === "MBGA2026") {
            // REPLACE the link below with your actual Microsoft Forms link
            window.location.href = "https://forms.cloud.microsoft/r/ULvNLjCRE4";
        } else {
            errorMsg.style.display = 'block';
            // Auto-hide error after 4 seconds
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }
    }
</script>

</body>
</html>
