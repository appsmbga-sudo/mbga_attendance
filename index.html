<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - Attendance Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #b0d4de;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: #f7f9fa;
            width: 100%;
            max-width: 450px;
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(11, 37, 69, 0.1);
            text-align: center;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .header-container {
            margin-bottom: 35px;
        }

        .title-large {
            font-size: 34px;
            font-weight: 800;
            color: #0b2545;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.8px;
        }

        .title-medium {
            font-size: 22px;
            font-weight: 700;
            color: #134074;
            margin-bottom: 6px;
        }

        .title-small {
            font-size: 15px;
            font-weight: 600;
            color: #5c677d;
            letter-spacing: 0.5px;
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .logo-wrap img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
        }

        .form-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: #0b2545;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.6px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 16px;
            font-size: 15px;
            border: 1px solid #ccd7e0;
            border-radius: 12px;
            background-color: #ffffff;
            color: #0b2545;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #0b2545;
            box-shadow: 0 0 0 4px rgba(11, 37, 69, 0.1);
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background-color: #0b2545;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            margin-top: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 12px rgba(11, 37, 69, 0.15);
        }

        .btn-submit:hover {
            background-color: #134074;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(11, 37, 69, 0.2);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-text {
            font-size: 12px;
            color: #8da2bb;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-container">
            <h1 class="title-large">FACULTY LOGIN</h1>
            <h2 class="title-medium">Attendance Portal</h2>
            <h3 class="title-small">Academic Year 2026</h3>
        </div>

        <div class="logo-wrap">
            <img src="logo.png" alt="Academy Logo">
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">USERNAME</label>
                <div class="input-wrapper">
                    <input class="form-input" type="text" id="username" placeholder="Enter your username" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="verification-code">VERIFICATION CODE</label>
                <div class="input-wrapper">
                    <input class="form-input" type="password" id="verification-code" placeholder="Enter access code" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">SIGN IN</button>
        </form>

        <div class="footer-text">
            &copy; 2026 MBGA. All Rights Reserved.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const code = document.getElementById('verification-code').value;

            window.location.href = "PUT_YOUR_TEAMS_LINK_HERE";
        });
    </script>

</body>
</html>
