<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Attendance Portal - Mohammed Bin Ghanim Academy</title>
    <style>
        * {
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 !important;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
        }

        body { 
            background-color: #b0d4de !important; 
            display: flex !important; 
            justify-content: center !important; 
            align-items: center !important; 
            height: 100vh !important; 
            padding: 20px !important;
        }

        .login-card { 
            background: #ffffff !important; 
            padding: 45px 35px !important; 
            border-radius: 24px !important; 
            box-shadow: 0 15px 35px rgba(11, 37, 69, 0.2) !important; 
            width: 100 !important; 
            max-width: 450px !important; 
            text-align: center !important; 
            border-top: 5px solid #1a478a !important; 
            border-bottom: 5px solid #bfa15c !important; 
        }

        /* Hierarchy Text Styling Under the Logo */
        .title-large {
            font-size: 34px !important;
            font-weight: 900 !important;
            color: #1a478a !important;
            text-transform: uppercase !important;
            margin-top: 15px !important;
            margin-bottom: 6px !important;
            letter-spacing: 0.8px !important;
        }

        .title-medium {
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #134074 !important;
            margin-bottom: 6px !important;
        }

        .title-small {
            font-size: 16px !important;
            font-weight: 600 !important;
            color: #5c677d !important;
            letter-spacing: 0.5px !important;
            margin-bottom: 30px !important;
        }

        /* Circular and Professional Logo Area */
        .academy-logo {
            width: 130px !important;
            height: 130px !important;
            object-fit: cover !important;
            border-radius: 50% !important;
            border: 3px solid #1a478a !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1) !important;
            background-color: #ffffff !important;
        }

        .input-group {
            text-align: left !important;
            margin-bottom: 24px !important;
        }

        /* Inputs: Bold, Dark, Capital */
        label {
            display: block !important;
            font-size: 14px !important;
            font-weight: 800 !important;
            color: #1a478a !important;
            text-transform: uppercase !important;
            margin-bottom: 8px !important;
            letter-spacing: 0.6px !important;
        }

        input { 
            width: 100% !important; 
            padding: 15px 16px !important; 
            border: 2px solid #ccd7e0 !important; 
            border-radius: 12px !important; 
            font-size: 15px !important; 
            background-color: #f8fafc !important;
            color: #1a478a !important;
            font-weight: 600 !important;
            transition: all 0.3s ease !important;
        }

        input:focus {
            border-color: #bfa15c !important;
            outline: none !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 0 4px rgba(191, 161, 92, 0.2) !important;
        }

        button { 
            width: 100% !important; 
            padding: 16px !important; 
            background-color: #1a478a !important; 
            color: white !important; 
            border: none !important; 
            border-radius: 12px !important; 
            cursor: pointer !important; 
            font-size: 16px !important; 
            font-weight: 800 !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
            transition: all 0.2s ease !important;
            margin-top: 10px !important;
            box-shadow: 0 4px 12px rgba(26, 71, 138, 0.2) !important;
        }

        button:hover { 
            background-color: #143566 !important; 
            transform: translateY(-1px) !important;
            box-shadow: 0 6px 15px rgba(26, 71, 138, 0.3) !important;
        }

        button:active {
            transform: translateY(0) !important;
        }

        #error-msg { 
            color: #d9534f !important; 
            margin-top: 15px !important; 
            display: none !important; 
            font-size: 14px !important;
            font-weight: bold !important;
        }

        .footer-text {
            margin-top: 30px !important;
            font-size: 12px !important;
            color: #718096 !important;
            font-weight: 600 !important;
            letter-spacing: 0.3px !important;
        }
    </style>
</head>
<body>

<div class="login-card">
    <img src="logo.png" alt="MBGMA Academy Logo" class="academy-logo">
    
    <h1 class="title-large">FACULTY LOGIN</h1>
    <h2 class="title-medium">Attendance Portal</h2>
    <h3 class="title-small">Academic Year 2026</h3>
    
    <div class="input-group">
        <label for="username">USERNAME</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
    </div>
    
    <div class="input-group">
        <label for="password">VERIFICATION CODE</label>
        <input type="password" id="password" placeholder="Enter access code">
    </div>
    
    <button onclick="checkLogin()">Sign In</button>
    <p id="error-msg">Invalid credentials. Please try again.</p>
    
    <p class="footer-text">&copy; 2026 MBGA. All Rights Reserved.</p>
</div>

<script>
    function checkLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');
        
        if (user === "MBGASTAFF" && pass === "MBGA2026") {
            window.location.href = "https://forms.cloud.microsoft/r/ULvNLjCRE4";
        } else {
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }
    }
</script>

</body>
</html>
